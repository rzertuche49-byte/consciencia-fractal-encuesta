<div id="cf-survey" class="cf-root">
  <style>
    #cf-survey{background-color:light-dark(#f7f5f8,#141217);color:light-dark(#201b24,#f4eff7);padding:20px 28px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:680px;box-sizing:border-box}
    #cf-survey *{box-sizing:border-box}
    #cf-survey .wrap{max-width:920px;margin:0 auto}
    #cf-survey .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:14px}
    #cf-survey .brand{display:flex;align-items:center;gap:12px}
    #cf-survey .mark{width:38px;height:38px;border-radius:50%;border:2px solid #6e3b8d;display:grid;place-items:center;position:relative}
    #cf-survey .mark:before,#cf-survey .mark:after{content:"";position:absolute;border:1px solid #b95574;border-radius:50%}
    #cf-survey .mark:before{width:24px;height:15px;transform:rotate(35deg)}
    #cf-survey .mark:after{width:15px;height:24px;transform:rotate(-35deg);border-color:#d79b38}
    #cf-survey .brandname{font-size:12px;letter-spacing:.18em;font-weight:800;text-transform:uppercase}
    #cf-survey .subbrand{font-size:11px;color:light-dark(#746b79,#aaa0ae);margin-top:2px}
    #cf-survey .step{font-size:12px;color:light-dark(#746b79,#aaa0ae);white-space:nowrap}
    #cf-survey .progress{height:5px;background:light-dark(#e8e3ea,#2d2930);border-radius:999px;overflow:hidden;margin-bottom:24px}
    #cf-survey .progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d388b,#ad426e,#d79b38);border-radius:inherit;transition:width .25s ease}
    #cf-survey .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#87529d;font-weight:800;margin-bottom:8px}
    #cf-survey h2{font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0;max-width:800px;letter-spacing:-.02em}
    #cf-survey .instruction{font-size:14px;color:light-dark(#716978,#b5acb9);margin:10px 0 18px;line-height:1.45}
    #cf-survey .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    #cf-survey .option{width:100%;min-height:64px;border:1px solid light-dark(#ddd6e1,#39333d);background:light-dark(#fff,#201d23);color:inherit;border-radius:14px;padding:11px 14px;text-align:left;display:flex;align-items:center;gap:13px;cursor:pointer;font:inherit;transition:border-color .15s,transform .15s,background .15s}
    #cf-survey .option:focus-visible{outline:3px solid rgba(118,65,145,.3);outline-offset:2px}
    #cf-survey .letter{width:29px;height:29px;border-radius:9px;background:light-dark(#f2eef4,#2d2930);display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:#79508d}
    #cf-survey .txt{font-size:13px;line-height:1.35;flex:1}
    #cf-survey .rank{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:850;border:1px solid transparent}
    #cf-survey .option[data-rank="1"]{border-color:#74438e;background:light-dark(#f7f0fa,#2c2231)}
    #cf-survey .option[data-rank="2"]{border-color:#b14c72;background:light-dark(#fbf1f5,#302229)}
    #cf-survey .option[data-rank="3"]{border-color:#bd8130;background:light-dark(#fcf6e9,#30291e)}
    #cf-survey .option[data-rank="1"] .rank{background:#74438e;color:white}
    #cf-survey .option[data-rank="2"] .rank{background:#b14c72;color:white}
    #cf-survey .option[data-rank="3"] .rank{background:#bd8130;color:white}
    #cf-survey .bottom{margin-top:16px;padding-top:14px;border-top:1px solid light-dark(#e3dde5,#343038);display:flex;align-items:center;justify-content:space-between;gap:16px}
    #cf-survey .status{font-size:12px;color:light-dark(#746c79,#aaa1ad)}
    #cf-survey .actions{display:flex;gap:8px}
    #cf-survey .btn{min-height:44px;border-radius:11px;padding:0 17px;border:1px solid light-dark(#d8d0dc,#403945);font-weight:750;cursor:pointer;font-size:13px;background:transparent;color:inherit}
    #cf-survey .btn.primary{border:0;background:#5d326f;color:white}
    #cf-survey .btn.primary:disabled{opacity:.35;cursor:not-allowed}
    #cf-survey .field{display:grid;gap:7px;margin:18px 0}
    #cf-survey label{font-size:12px;font-weight:750;color:light-dark(#5d5362,#c9c0cc)}
    #cf-survey input,#cf-survey textarea{width:100%;border:1px solid light-dark(#d7d0dc,#403945);background:light-dark(#fff,#201d23);color:inherit;border-radius:12px;padding:13px 14px;font:inherit}
    #cf-survey textarea{min-height:92px;resize:vertical;line-height:1.45}
    #cf-survey .card{border:1px solid light-dark(#ded7e2,#39333d);background:light-dark(#fff,#1e1b21);border-radius:18px;padding:24px}
    #cf-survey .small{font-size:12px;color:light-dark(#746b79,#aaa0ae);line-height:1.5}
    #cf-survey .done{display:grid;gap:18px}
    #cf-survey .donebox{background:light-dark(#f0ebf3,#242027);border-radius:14px;padding:16px;font-size:13px;line-height:1.55;max-height:360px;overflow:auto;white-space:pre-wrap}
    #cf-survey .hide{display:none!important}
    @media(max-width:680px){#cf-survey{padding:20px 15px}.options{grid-template-columns:1fr!important}.top{align-items:center!important}.brandname{font-size:11px!important}.bottom{align-items:stretch!important;flex-direction:column}.actions{width:100%}.btn{flex:1}.option{min-height:66px!important}.card{padding:18px}}
  </style>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="mark" aria-hidden="true"></div><div><div class="brandname">Consciencia Fractal</div><div class="subbrand">Mapa de patrones personales</div></div></div>
      <div class="step" id="cf-step">Inicio</div>
    </div>
    <div class="progress" aria-label="Progreso de la encuesta"><span id="cf-progress"></span></div>
    <div id="cf-content"></div>
  </div>
  <script>
    (()=>{
      const root=document.getElementById('cf-survey');
      if(!root || root.dataset.ready==='1') return;
      root.dataset.ready='1';
      const content=root.querySelector('#cf-content');
      const step=root.querySelector('#cf-step');
      const progress=root.querySelector('#cf-progress');
      const q={
        3:{b:'',t:'¿Cómo eres de forma natural?',o:{0:'Soy una persona tranquila; procuro mantenerme presente, consciente y atenta a lo que ocurre.',1:'Me gusta estar activo, hacer cosas, ejecutar tareas y llevar las ideas a la acción.',2:'Soy intuitivo y tengo facilidad para comunicar o expresar lo que siento y percibo.',3:'Soy observador; suelo percibir detalles y situaciones que otras personas pueden pasar por alto.',4:'Me gusta dar forma y estructura a las cosas y tengo claridad sobre quién soy y cómo quiero hacerlas.',5:'Me gusta que las cosas tengan lógica, orden y una utilidad o función clara.',6:'Suelo reconocer posibilidades y oportunidades con facilidad.',7:'Me gusta generar conexión, colaboración e integración entre las personas.',8:'Me gusta liderar, coordinar y hacer que las cosas sucedan.',9:'Tengo claridad sobre mis metas y propósito, y suelo orientar mis acciones hacia ellos.'}},
        4:{b:'',t:'¿Qué habilidades o destrezas sobresalientes consideras que tienes?',o:{0:'Tengo facilidad para recuperar mi tranquilidad y volver a mi centro.',1:'Tengo capacidad para actuar, superar obstáculos y llevar las cosas hasta terminarlas.',2:'Tengo facilidad para comunicarme con claridad y expresar lo que siento o percibo.',3:'Tengo capacidad de observación, análisis y pensamiento crítico.',4:'Tengo claridad sobre mi identidad y facilidad para dar forma y estructura a lo que hago.',5:'Tengo facilidad para encontrar soluciones lógicas, simples, ordenadas y funcionales.',6:'Tengo facilidad para reconocer posibilidades, alternativas y oportunidades.',7:'Tengo facilidad para integrar personas o elementos y generar colaboración y sentido de pertenencia.',8:'Tengo capacidad para liderar, coordinar, influir y concretar.',9:'Tengo claridad sobre mi propósito, objetivos y metas, y puedo orientar mis acciones hacia ellos.'}},
        5:{b:'',t:'¿Qué cosas o circunstancias tienden a hacerte enojar?',o:{0:'Cuando pierdo mi tranquilidad o siento que una situación me saca de mi centro.',1:'Cuando las personas no hacen lo que tienen que hacer o no actúan cuando es necesario.',2:'Cuando las cosas no se comunican claramente y eso provoca confusión o errores.',3:'Cuando alguien no observa, no presta atención o no analiza suficientemente lo que está ocurriendo.',4:'Cuando no existe claridad, estructura u organización sobre cómo deben hacerse las cosas.',5:'Cuando las cosas se hacen sin lógica, orden o funcionalidad.',6:'Cuando existen buenas posibilidades u oportunidades y se dejan pasar.',7:'Cuando falta colaboración, compromiso, integración o sentido de pertenencia.',8:'Cuando existen errores o fallas por falta de liderazgo o coordinación.',9:'Cuando se hacen cosas sin tener clara la finalidad, objetivo o resultado que se quiere alcanzar.'}},
        6:{b:'',t:'¿Qué cosas o circunstancias tienden a generarte presión o estrés?',o:{0:'Sentir que estoy perdiendo tranquilidad, equilibrio o capacidad para mantenerme centrado.',1:'Tener muchas cosas pendientes o sentir que no puedo actuar o avanzar como necesito.',2:'No contar con información suficiente o sentir que la comunicación no es clara.',3:'No comprender bien lo que ocurre o sentir que necesito analizar demasiado para entenderlo.',4:'Encontrarme en situaciones desorganizadas, sin estructura o sin claridad sobre cómo proceder.',5:'Tener que trabajar con procesos o soluciones que no son lógicas, prácticas o funcionales.',6:'Tener demasiadas alternativas o no poder identificar cuál es la mejor posibilidad.',7:'Estar en ambientes donde existe desconexión, conflicto o poca colaboración entre las personas.',8:'Tener que responder por algo cuando existe poca coordinación, liderazgo o capacidad para concretar.',9:'Sentir que se acerca un plazo y que podemos no alcanzar la meta o resultado esperado.'}},
        7:{b:'',t:'¿En qué momentos sientes que fluyes y que las cosas salen bien?',o:{0:'Cuando estoy presente, tranquilo y disfrutando conscientemente el momento.',1:'Cuando estoy haciendo cosas que disfruto y puedo llevarlas a la práctica.',2:'Cuando puedo sentir, comunicarme y conectar naturalmente con otras personas.',3:'Cuando tengo espacio para observar, pensar, leer, comprender o aprender.',4:'Cuando puedo ser yo mismo y dar forma a las cosas de una manera coherente conmigo.',5:'Cuando lo que hago tiene lógica, orden, funciona y genera un resultado útil.',6:'Cuando puedo reconocer buenas posibilidades y siento que estoy aprovechando una de ellas.',7:'Cuando existe conexión, colaboración, integración y sentido de pertenencia con otras personas.',8:'Cuando estoy liderando, coordinando o haciendo que algo importante suceda.',9:'Cuando siento que lo que hago me acerca a mi propósito, metas u objetivos.'}}
      };
      const endpoint='https://script.google.com/macros/s/AKfycbxtAcv3qJ2flQblgKLd4PJri91Bf9d8kKsk_aF_9fb6w7VCpu0kkL3GDkXwDwLiU2rv/exec';
      const state={screen:'start',index:0,name:'',dob:'',answers:{},detail:{3:'',4:'',5:'',6:'',7:''},open:{15:'',16:''},order:{},sending:false,sendError:'',surveyId:'CF-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)};
      const structured=[3,4,5,6,7];
      const totalScreens=1+structured.length+2+1;
      function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
      function setProgress(n,label){step.textContent=label;progress.style.width=Math.max(0,Math.min(100,(n/(totalScreens-1))*100))+'%'}
      function start(){state.name=(root.querySelector('#cf-name')?.value||'').trim();state.dob=root.querySelector('#cf-dob')?.value||'';if(!state.name||!state.dob){root.querySelector('#cf-start-msg').textContent='Completa nombre y fecha de nacimiento para continuar.';return}state.screen='q';state.index=0;render()}
      function renderStart(){setProgress(0,'Inicio');content.innerHTML='<div class="card"><div class="eyebrow">Cuestionario de exploración</div><h2>Consciencia Fractal</h2><p class="instruction">Responde pensando en cómo te reconoces hoy. Son 7 preguntas breves y no existen respuestas correctas o incorrectas.</p><div class="field"><label for="cf-name">Nombre completo</label><input id="cf-name" autocomplete="name" placeholder="Nombre completo" value="'+(state.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></div><div class="field"><label for="cf-dob">Fecha de nacimiento</label><input id="cf-dob" type="date" value="'+(state.dob||'')+'"></div><div class="bottom"><span class="status" id="cf-start-msg"></span><div class="actions"><button class="btn primary" id="cf-start">Comenzar →</button></div></div></div>';root.querySelector('#cf-start').onclick=start}
      function renderQuestion(){const num=structured[state.index],item=q[num],visible=state.index+1;if(!state.order[num])state.order[num]=shuffle(Object.entries(item.o));const selected=state.answers[num]||[];setProgress(visible,'Pregunta '+visible+' de 7');const openPrompt={3:'Amplía con tus propias palabras cómo eres de forma natural.',4:'Amplía con tus propias palabras las habilidades o destrezas que tienes.',5:'Amplía con tus propias palabras qué situaciones tienden a hacerte enojar.',6:'Amplía con tus propias palabras qué situaciones tienden a generarte presión o estrés.',7:'Amplía con tus propias palabras en qué momentos sientes que fluyes.'}[num];content.innerHTML='<div class="eyebrow">Pregunta '+visible+'</div><h2>'+item.t+'</h2><p class="instruction">Selecciona hasta 3 opciones con las que más te identificas. No necesitas ordenarlas.</p><div class="options" id="cf-options"></div><div class="field" style="margin-top:18px;padding-top:16px;border-top:1px solid light-dark(#e3dde5,#343038)"><label for="cf-detail" style="font-size:14px">'+openPrompt+'</label><textarea id="cf-detail" placeholder="Escribe aquí...">'+(state.detail[num]||'')+'</textarea></div><div class="bottom"><div class="status"><strong>'+selected.length+' de 3</strong> seleccionadas</div><div class="actions"><button class="btn" id="cf-back">← Atrás</button><button class="btn" id="cf-clear">Limpiar</button><button class="btn primary" id="cf-next" '+(selected.length>0?'':'disabled')+'>Continuar →</button></div></div>';const box=root.querySelector('#cf-options'),detail=root.querySelector('#cf-detail');detail.oninput=()=>{state.detail[num]=detail.value};state.order[num].forEach(([code,text],i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.dataset.code=code;const chosen=selected.includes(Number(code));if(chosen)b.dataset.rank='1';b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="txt">'+text+'</span><span class="rank">'+(chosen?'✓':'')+'</span>';b.onclick=()=>{state.detail[num]=detail.value;const arr=state.answers[num]||[];const c=Number(code),idx=arr.indexOf(c);if(idx>=0)arr.splice(idx,1);else if(arr.length<3)arr.push(c);state.answers[num]=arr;renderQuestion()};box.appendChild(b)});root.querySelector('#cf-clear').onclick=()=>{state.detail[num]=detail.value;state.answers[num]=[];renderQuestion()};root.querySelector('#cf-back').onclick=()=>{state.detail[num]=detail.value;if(state.index===0){state.screen='start'}else state.index--;render()};root.querySelector('#cf-next').onclick=()=>{state.detail[num]=detail.value;if((state.answers[num]||[]).length<1)return;if(state.index<structured.length-1){state.index++;render()}else{state.screen='open';state.index=15;render()}}}
      function renderOpen(num){const visible=num===15?6:7;setProgress(structured.length+(num===15?1:2),'Pregunta '+visible+' de 7');const title=num===15?'Tus tres deseos':'La historia de tu vida';const prompt=num===15?'Si llegara el mago de la lámpara y pudieras pedir tres deseos, ¿cuáles serían?':'Si tu vida hasta hoy fuera un libro, novela o película, ¿qué título tendría y por qué?';content.innerHTML='<div class="eyebrow">Pregunta '+visible+'</div><h2>'+title+'</h2><p class="instruction">'+prompt+'</p><textarea id="cf-open" placeholder="Escribe aquí...">'+(state.open[num]||'')+'</textarea><div class="bottom"><div class="status">Respuesta abierta</div><div class="actions"><button class="btn" id="cf-back">← Atrás</button><button class="btn primary" id="cf-next" '+((state.open[num]||'').trim()?'':'disabled')+'>'+ (num===16?'Finalizar →':'Continuar →') +'</button></div></div>';const ta=root.querySelector('#cf-open'),next=root.querySelector('#cf-next');ta.oninput=()=>{next.disabled=!ta.value.trim()};root.querySelector('#cf-back').onclick=()=>{state.open[num]=ta.value;if(num===15){state.screen='q';state.index=structured.length-1}else{state.index=15}render()};next.onclick=()=>{if(!ta.value.trim())return;state.open[num]=ta.value;if(num===15){state.index=16;render()}else submitSurvey()}}
      function buildPayload(){const respuestas={};structured.forEach(num=>{respuestas[num]=(state.answers[num]||[]).map(c=>({codigo:c,texto:q[num].o[c]}))});return {nombre:state.name,fechaNacimiento:state.dob,version:'V4.3-narrativa',respuestas,respuestasAbiertas:state.detail,p15:state.open[15]||'',p16:state.open[16]||'',idEncuesta:state.surveyId,navegador:navigator.userAgent}}
      async function submitSurvey(){if(state.sending)return;state.sending=true;state.sendError='';setProgress(totalScreens-1,'Enviando');content.innerHTML='<div class="done"><div class="eyebrow">Finalizando encuesta</div><h2>Guardando tus respuestas...</h2><p class="instruction">Espera unos segundos y no cierres esta ventana.</p></div>';try{const payload=JSON.stringify(buildPayload());let queued=false;if(navigator.sendBeacon){const blob=new Blob([payload],{type:'text/plain;charset=UTF-8'});queued=navigator.sendBeacon(endpoint,blob)}if(!queued){await fetch(endpoint,{method:'POST',mode:'no-cors',body:payload})}state.screen='done';state.sending=false;render()}catch(e){state.sending=false;state.sendError='No pudimos registrar tus respuestas. Revisa tu conexión e intenta nuevamente.';renderSubmitError()}}
      function renderSubmitError(){setProgress(totalScreens-1,'Error de envío');content.innerHTML='<div class="done"><div class="eyebrow">No se pudo completar el envío</div><h2>Intenta nuevamente.</h2><p class="instruction">'+state.sendError+'</p><div class="actions"><button class="btn" id="cf-back16">← Volver</button><button class="btn primary" id="cf-retry">Reintentar envío</button></div></div>';root.querySelector('#cf-back16').onclick=()=>{state.screen='open';state.index=16;render()};root.querySelector('#cf-retry').onclick=submitSurvey}
      function renderDone(){setProgress(totalScreens-1,'Completada');content.innerHTML='<div class="done"><div class="eyebrow">Encuesta completada</div><h2>Gracias por responder.</h2><p class="instruction">Tus respuestas han sido registradas correctamente.</p></div>'}
      function render(){if(state.screen==='start')renderStart();else if(state.screen==='q')renderQuestion();else if(state.screen==='open')renderOpen(state.index);else renderDone()}
      render();
    })();
  </script>
</div>
